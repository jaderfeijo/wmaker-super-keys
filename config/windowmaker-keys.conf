# Window Maker's own keyboard shortcuts, macOS style (Super is Cmd).
# One "Key = value" per line, in Window Maker's property-list syntax.
CloseKey = "Mod4+W"
MiniaturizeKey = "Mod4+M"
HideKey = "Mod4+H"
FocusNextKey = "Mod4+Tab"
FocusPrevKey = "Mod4+Shift+Tab"
MaximizeKey = "Mod4+Control+F"
NextWorkspaceKey = "Mod4+Control+Right"
PrevWorkspaceKey = "Mod4+Control+Left"
