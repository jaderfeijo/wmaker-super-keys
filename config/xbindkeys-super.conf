# Super-key shortcuts for xbindkeys (installed by wmaker-super-keys). Mod4 is the Super / Windows key.

# App launcher (rofi). A second press closes it.
"pkill -x rofi || wmsk-launcher drun"
    Mod4 + space

"wmsk-launcher run"
    Mod4 + r

# Lock the screen (needs a screen locker that reacts to lock-session, e.g. xss-lock + i3lock)
"loginctl lock-session"
    Mod4 + Control + q

# Cycle windows of the same app / open a new window of the focused app (like Cmd+` and Cmd+N)
"wmsk-cycle-windows"
    Mod4 + grave

"wmsk-new-window"
    Mod4 + n

# Desktops: Super+1..9 switches (creating the desktop if needed), Super+0 is desktop 10;
# add Shift to move the focused window there
"wmsk-goto-desktop 1"
    Mod4 + 1

"wmsk-goto-desktop 2"
    Mod4 + 2

"wmsk-goto-desktop 3"
    Mod4 + 3

"wmsk-goto-desktop 4"
    Mod4 + 4

"wmsk-goto-desktop 5"
    Mod4 + 5

"wmsk-goto-desktop 6"
    Mod4 + 6

"wmsk-goto-desktop 7"
    Mod4 + 7

"wmsk-goto-desktop 8"
    Mod4 + 8

"wmsk-goto-desktop 9"
    Mod4 + 9

"wmsk-goto-desktop 10"
    Mod4 + 0

"wmsk-move-to-desktop 1"
    Mod4 + Shift + 1

"wmsk-move-to-desktop 2"
    Mod4 + Shift + 2

"wmsk-move-to-desktop 3"
    Mod4 + Shift + 3

"wmsk-move-to-desktop 4"
    Mod4 + Shift + 4

"wmsk-move-to-desktop 5"
    Mod4 + Shift + 5

"wmsk-move-to-desktop 6"
    Mod4 + Shift + 6

"wmsk-move-to-desktop 7"
    Mod4 + Shift + 7

"wmsk-move-to-desktop 8"
    Mod4 + Shift + 8

"wmsk-move-to-desktop 9"
    Mod4 + Shift + 9

"wmsk-move-to-desktop 10"
    Mod4 + Shift + 0

# Window placement: tile left/right, center, maximize (toggle), minimize, un-minimize the last one, restore original size
"wmsk-snap left"
    Mod4 + Shift + Left

"wmsk-snap right"
    Mod4 + Shift + Right

"wmsk-snap center"
    Mod4 + Shift + c

"wmsk-snap maximize"
    Mod4 + Shift + Return

"wmsk-snap minimize"
    Mod4 + Shift + Down

"wmsk-snap unminimize"
    Mod4 + Shift + Up

"wmsk-snap restore"
    Mod4 + Shift + r

# Move the focus to the nearest window in the direction of the arrow
"wmsk-focus-dir left"
    Mod4 + Left

"wmsk-focus-dir right"
    Mod4 + Right

"wmsk-focus-dir up"
    Mod4 + Up

"wmsk-focus-dir down"
    Mod4 + Down

# Hide every window on this desktop / bring them back
"wmsk-show-desktop"
    Mod4 + Shift + h
